packages:
  - apps/*
  - packages/*
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  electron: true
  electron-winstaller: true
  esbuild: true
  # Windows binaries ship inside the package; its install script only fetches optional GPU builds (M6).
  onnxruntime-node: false
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
