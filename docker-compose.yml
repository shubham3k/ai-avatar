# As of Phase 4.1, apps/api uses an embedded SQLite database (see
# docs/SQLITE_MIGRATION.md) — nothing in this repo requires Postgres
# anymore. Left in place, unused, only in case you have another reason to
# want a local Postgres instance.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_exec_agent
    ports:
      # Host 5433 to avoid conflicts with an existing local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
